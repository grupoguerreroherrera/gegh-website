name: Verificación del sitio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # La rama main exige que pase una comprobación llamada "build-and-test";
  # este trabajo la cumple: verifica secretos, CSP y recursos antes de publicar.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verificar secretos, CSP y recursos
        run: python3 scripts/verificar.py
